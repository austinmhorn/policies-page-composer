name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Go unit tests
        run: go test ./...
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Render raw Notion fixture
        run: python scripts/render_workflow.py --fixture examples/notion_fixture.json --minimum-count 1
      - name: Render normalized Go-shaped snapshot
        run: python scripts/render_workflow.py --policies-json examples/normalized_policies.json --minimum-count 1
