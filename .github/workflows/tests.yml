name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Render fixture
        run: python scripts/render_workflow.py --fixture examples/notion_fixture.json --minimum-count 1
